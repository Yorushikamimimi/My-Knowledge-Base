<!doctype html>
<html class="light" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能知识库</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Hanken+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#d2d9f4",
              "on-primary-fixed-variant": "#003ea8",
              "surface-container-lowest": "#ffffff",
              "on-tertiary-fixed-variant": "#444749",
              "surface-tint": "#0053db",
              "on-tertiary-fixed": "#191c1e",
              "on-secondary": "#ffffff",
              "secondary-container": "#d0e1fb",
              "background": "#faf8ff",
              "tertiary-container": "#6b6e70",
              "tertiary": "#525657",
              "surface-container-low": "#f2f3ff",
              "on-primary-fixed": "#00174b",
              "surface-container": "#eaedff",
              "on-error-container": "#93000a",
              "secondary": "#505f76",
              "primary-fixed": "#dbe1ff",
              "primary-fixed-dim": "#b4c5ff",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed": "#0b1c30",
              "on-primary": "#ffffff",
              "tertiary-fixed": "#e0e3e5",
              "inverse-surface": "#283044",
              "outline-variant": "#c3c6d7",
              "error": "#ba1a1a",
              "tertiary-fixed-dim": "#c4c7c9",
              "primary": "#004ac6",
              "secondary-fixed-dim": "#b7c8e1",
              "on-surface": "#131b2e",
              "on-secondary-fixed-variant": "#38485d",
              "surface-variant": "#dae2fd",
              "surface": "#faf8ff",
              "primary-container": "#2563eb",
              "on-secondary-container": "#54647a",
              "inverse-primary": "#b4c5ff",
              "on-surface-variant": "#434655",
              "surface-container-high": "#e2e7ff",
              "outline": "#737686",
              "inverse-on-surface": "#eef0ff",
              "on-background": "#131b2e",
              "surface-bright": "#faf8ff",
              "on-tertiary-container": "#eff1f3",
              "surface-container-highest": "#dae2fd",
              "secondary-fixed": "#d3e4fe",
              "on-primary-container": "#eeefff",
              "error-container": "#ffdad6",
              "on-error": "#ffffff"
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            },
            spacing: {
              "sidebar-primary-width": "240px",
              "stack-md": "1rem",
              "stack-lg": "1.5rem",
              "container-max-width": "1440px",
              "stack-sm": "0.5rem",
              "margin-mobile": "1rem",
              "gutter": "1.5rem",
              "sidebar-secondary-width": "280px"
            },
            fontFamily: {
              "title-lg": ["Inter"],
              "display-lg": ["Hanken Grotesk"],
              "label-md": ["Inter"],
              "headline-md": ["Hanken Grotesk"],
              "body-sm": ["Inter"],
              "headline-md-mobile": ["Hanken Grotesk"],
              "body-md": ["Inter"]
            },
            fontSize: {
              "title-lg": ["18px", { lineHeight: "24px", fontWeight: "600" }],
              "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
              "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
              "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
              "body-sm": ["13px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-md-mobile": ["20px", { lineHeight: "28px", fontWeight: "600" }],
              "body-md": ["14px", { lineHeight: "22px", fontWeight: "400" }]
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>
  <body class="bg-surface-container-lowest text-on-surface h-screen flex flex-col overflow-hidden font-body-md selection:bg-primary/10">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
